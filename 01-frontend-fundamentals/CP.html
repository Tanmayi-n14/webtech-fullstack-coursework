<html>
	<head>
		<title>My first callback webpage </title>
			
	</head>	
	
	<body>
	
	<p id="demo"> </p>
	
	<script>
		
		function func1(some)
		{
			document.getElementById("demo").innerHTML=some;
		}
		
		var prom1 = new Promise (function (res,rej)
		{
			var x=0;
			if (x==0)
			{
				res("Ok correct")
			}
			else
			{
				rej("No incorrect")
			}
		});
		
		prom1
		.then(function(value)
		{
			func1(value)
		})
		.then(function()
		{
			document.write("Promise is working")
		})
		.catch(function(error)
		{
			func1(error)
		})
		
		
	</script>
		
		
	</body>
	
</html>
